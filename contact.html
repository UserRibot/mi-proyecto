<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <title>ViaNova Projects</title>
    <link rel="stylesheet" href="css\style.css">  
    <script src="https://kit.fontawesome.com/43329fc4fe.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <a href="./index.html"><img src="assets/img/Logo.jpg" alt="ViaNova Projects" class="nav-logo"></a>
            <ul class="nav-links">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="projects.html">Proyectos</a></li>
                <li><a href="galery.html">Galería</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Contacto</h1>  
        <section class="main-section">
            <form class="form">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" name="name" id="name" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="lastname">Apellido</label>
                    <input type="text" name="lastname" id="lastname" placeholder="Tu apellido" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefono</label>
                    <input type="tel" name="phone" id="phone" placeholder="+54 11 1234-5678" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="your-email@email.com" required>
                </div>
                <div class="form-group">
                    <label for="reason">Motivo de contacto</label>
                    <select name="reason" id="reason">
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="reserva">Consulta sobre proyecto</option>
                        <option value="eventos">Cotización de obras</option>
                        <option value="trabajo">Trabaja con nosotros</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comment">Mensaje</label>
                    <textarea name="comment" id="comment" placeholder="Contanos en qué te podemos ayudar" required cols="40" rows="5" maxlength="1500" minlength="1"></textarea>
                </div>
                <div class="form-buttons">
                    <button class="btn btn-primary" type="submit">Enviar mensaje</button>
                    <button class="btn btn-secondary" type="reset">Limpiar formulario</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <ul class="footer-nav">
            <li><a href="./index.html">Inicio</a></li>
            <li><a href="projects.html">Proyectos</a></li>
            <li><a href="galery.html">Galería</a></li>
            <li><a href="contact.html">Contacto</a></li>
        </ul>
        <div class="footer-social">
            <a href="https://www.instagram.com/vianova/"><i class="fa fa-instagram"></i></a>
            <a href="https://www.facebook.com/vianova"><i class="fa-brands fa-square-facebook"></i></a>
            <a href="https://www.x.com/vianova"><i class="fa-brands fa-x-twitter fa-canvas-square"></i></a>
            <a href="https://www.youtube.com/vianova"><i class="fa-brands fa-youtube fa-canvas-square"></i></a>
            <a href="https://www.linkedin.com/vianova"><i class="fa-brands fa-linkedin fa-canvas-square"></i></a>
        </div>
    </footer>
</body>
</html>
